server:
  port: 8080
google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID}
app:
  pagination:
    default-page-size: 20

spring:
  application:
    name: p2-backend-api
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'America/Los_Angeles' # Set timezone to PST
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100