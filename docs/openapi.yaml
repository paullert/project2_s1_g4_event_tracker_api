# OpenAPI contract for CST 438 Project 02.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: Event Tracker API
  version: 1.0.0
  description: |
    Users accept invites to digitally track events hosted by other users with advanced permissions.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 04
    url: https://github.com/paullert/project2_s1_g4_event_tracker_api

servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://your-api.example.com
    description: Production (replace in Sprint 3)

# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Unregistered
    description: Endpoints accessible to all unauthenticated users
  - name: Registered
    description: Endpoints accessible to all signed-in users
  - name: Manager
    description: Endpoints accessible to all users with the Manager role
  - name: Admin
    description: Endpoints accessible to all users with the Admin role
  - name: Invites
    description: Endpoints related to invites
  - name: Events
    description: Endpoints related to events, non-GET endpoints locked to manager role and above
  - name: Locations
    description: Endpoints related to physical locations


paths:
  /auth/me:
    get:
      tags: [Registered]
      operationId: getCurrentUser
      summary: Get the application account for the authenticated Google identity
      responses:
        '200':
          description: The current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/register:
    post:
      tags: [Registered]
      operationId: registerAccount
      summary: Register an account using an authenticated Google identity
      description: The Google ID token must include the email claim. New accounts always have the USER role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Registered account, or the existing account for this identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/events:
    get:
      tags: [Events, Unregistered]
      operationId: listPublicEvents
      summary: List of currently active, public, events (paginated)
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Field and direction, Spring Pageable style. Default is 'startsOn,desc'
          schema:
            type: string
            enum: ['startsOn,desc', 'startsOn,asc']
            default: 'startsOn,desc'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: One page of active events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Events, Manager]
      operationId: createEvent
      summary: Create a new event (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Created. POST is not idempotent; two calls make two events.
          headers:
            Location:
              description: URL of the new event
              schema:
                type: string
                example: /api/v1/events/3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events, Unregistered]
      operationId: getEvent
      summary: Get one active event (public)
      security: []
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Events, Admin]
      operationId: replaceEvent
      summary: Replace an event (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The replaced event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Events, Manager]
      operationId: updateEvent
      summary: Change some fields of an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Events, Manager]
      operationId: deleteEvent
      summary: Delete an event (manager only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          description: Deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/events/{eventId}/managers/{managerId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: managerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Events, Admin]
      operationId: assignEventManager
      summary: Assign a manager to an event (admin only)
      description: |
        Multiple managers may share an event. The assigned user must have the
        MANAGER role. Repeating an existing assignment leaves it unchanged.
        Assigned managers can edit or delete the event and manage its invites.
        A manager who creates a new event is assigned automatically.
      responses:
        '204':
          description: Manager assigned
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Events, Admin]
      operationId: removeEventManager
      summary: Remove a manager assignment (admin only)
      description: Removing an absent assignment also succeeds.
      responses:
        '204':
          description: Manager assignment removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/events/{eventId}/totalAttendees:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Unregistered, Registered, Events]
      operationId: getEventTotalAttendees
      summary: Get the accepted attendee count, or the stored archived count when archived is true.
      security: []
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The total number of attendees
          content:
            application/json:
              schema:
                type: integer
                example: 12345
        '401':
          $ref: '#/components/responses/Unauthorized'

        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: View registered locations (public, filterable)
      security: []          # public: no token needed
      parameters:
        - name: sort
          in: query
          description: Field and direction, Spring Pageable style. Default is 'updatedAt,desc'.
          schema:
            type: string
            enum: [ 'updatedAt,desc', 'updatedAt,asc' ]
            default: 'updatedAt,desc'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Locations, Admin]
      operationId: createLocation
      summary: Create a new location (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '201':
          description: Location created
          headers:
            Location:
              description: URL of the new location
              schema:
                type: string
                example: /api/v1/locations/18
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    get:
      tags: [Locations, Unregistered]
      operationId: getLocation
      summary: View a location (public)
      security: []
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: The location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ Locations, Admin ]
      operationId: replaceLocation
      summary: Replace a location (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Location'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The replaced location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Locations, Admin ]
      operationId: updateLocation
      summary: Change some fields of an location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Locations, Admin ]
      operationId: deleteLocation
      summary: Delete a location (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          description: Deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'


  /api/v1/users/me:
    delete:
      tags: [Users]
      operationId: deleteMyAccount
      summary: Delete my own account and ALL my data
      description: Any signed-in user. Deletes the user row and everything they own (event invitations).
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted. The token is now useless.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List all users (admin only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Admin]
      operationId: createUser
      summary: Create an application account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, subject, role]
              properties:
                username:
                  type: string
                email:
                  type: string
                subject:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: The created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 7
    get:
      tags: [Admin]
      operationId: getUser
      summary: View one user (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateUserRole
      summary: Grant or revoke admin (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Delete a user and all their data (admin only)
      description: Requires the ADMIN role. A USER token gets 403.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invites:
    get:
      tags: [Invites, Admin]
      operationId: listAllInvites
      summary: List all invites (admin only)
      description: Lists invitations across all users and events. Requires ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: All invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/invites/users/{userId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Invites, Admin]
      operationId: getInvite
      summary: Get a specific invite using userId and eventId (admin only)
      description: Requires ADMIN.
      responses:
        '200':
          description: The invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Invites, Admin]
      operationId: updateInvite
      summary: Update an invite (admin only)
      description: Allows an administrator to change an invitation's status or message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAdminPatch'
      responses:
        '200':
          description: The updated invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Invites, Admin]
      operationId: deleteInvite
      summary: Delete an invite (admin only)
      description: Requires ADMIN.
      responses:
        '204':
          description: Invitation deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invites/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [ Invites, Admin ]
      operationId: listUserInvites
      summary: List a user's invites (admin only)
      description: Lists invitations addressed to the specified user. Requires ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: The user's invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/invites/me:
    get:
      tags: [ Users, Invites ]
      operationId: listMyInvites
      summary: Get invites to events I'm invited to
      description: Returns invitations addressed to the authenticated user.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The authenticated user's invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/invites/me/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Users, Invites, Registered]
      operationId: getMyInvite
      summary: Get an invitation I've recieved
      description: The authenticated user may view their own invitation. No request body is needed.
      responses:
        '200':
          description: The event invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        
    patch:
      tags: [ Users, Invites, Registered ]
      operationId: respondToMyInvite
      summary: Accept or decline my invitation
      description: The authenticated user may accept or decline an invitation addressed to them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteResponsePatch'
      responses:
        '200':
          description: The updated invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/invites/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [ Invites, Manager, Admin ]
      operationId: listEventInvites
      summary: List invites for an event (manager or admin)
      description: Lists invitations for this event. Requires an assigned MANAGER or ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: The invites to the specified event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePage'
    post:
      tags: [ Invites, Manager, Admin ]
      operationId: createEventInvites
      summary: Invite multiple users to an event
      description: Creates pending invitations for multiple users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInviteRequest'
      responses:
        '201':
          description: Invitations created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the OAuth2 Authorization Code + PKCE flow (with Google, send the ID token; Google's access_token is opaque).

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 7
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 7
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Event:
      type: object
      required: [ eventId, eventName, eventDescription, startsOn, creatorId, updatedAt ]
      properties:
        eventId:
          type: integer
          format: int64
          readOnly: true
          example: 42
          description: Internal DB id of the event.
        eventName:
          type: string
          example: 2026 Summer Bash-athon
          maxLength: 255
          description: The name of the event.
        eventDescription:
          type: string
          example: Lots of bashing and side activities.
          description: The description of the event.
        startsOn:
          allOf:
            - $ref: '#/components/schemas/Date-Time'
          description: The date and time of the event's start.
        locationId:
          type: integer
          format: int64
          description: Internal ID of the event location.
        creatorId:
          type: integer
          format: int64
          example: 7
          description: The user who created the event, refernced by internal DB id.
        updatedAt:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Date-Time'
          description: The date and time of the last edit to the event.

    EventCreate:
      description: Body for POST and PUT. PUT replaces every field.
      type: object
      required: [ eventName, eventDescription, startsOn, locationId ] # omits updatedOn, will automatically update value
      properties:
        eventId:
          type: integer
          format: int64
          readOnly: true
          example: 42
          description: Internal DB id of the event.
        eventName:
          type: string
          example: 2026 Summer Bash-athon
          maxLength: 255
          description: The name of the event.
        eventDescription:
          type: string
          example: Lots of bashing and side activities.
          description: The description of the event.
        startsOn:
          allOf:
            - $ref: '#/components/schemas/Date-Time'
          description: The date and time of the event's start.
        locationId:
          type: integer
          format: int64
          description: Internal ID of the event location.
        creatorId:
          type: integer
          format: int64
          example: 7
          description: The user who created the event, refernced by internal DB id.

    EventPatch:
      description: Body for PATCH. Send only the fields you want to change.
      type: object
      minProperties: 1
      properties: # omits updatedOn, will automatically update value
        eventName:
          type: string
          example: 2026 Summer Bash-athon
          maxLength: 255
          description: The name of the event.
        eventDescription:
          type: string
          example: Lots of bashing and side activities.
          description: The description of the event.
        startsOn:
          allOf:
            - $ref: '#/components/schemas/Date-Time'
          description: The date and time of the event's start.
        locationId:
          type: integer
          format: int64
          description: Internal ID of the event location.
        creatorId:
          type: integer
          format: int64
          example: 7
          description: The user who created the event, refernced by internal DB id.

    Location:
      type: object
      required: [ locationId, locationName, address, updatedAt ]
      properties:
        locationId:
          readOnly: true
          type: integer
          format: int64
          example: 7
        locationName:
          type: string
          maxLength: 255
        address:
          type: string
          example: 100 Main Street
        locationDesc:
          type: string
          nullable: true
        updatedAt:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Date-Time'
          description: The date and time of the last edit to the location.

    LocationPatch:
      description: Body for PATCH /api/v1/locations/{locationId}.
      type: object
      minProperties: 1
      properties:
        locationId:
          readOnly: true
          type: integer
          format: int64
          example: 7
        locationName:
          type: string
          maxLength: 255
        address:
          type: string
          example: 100 Main Street
        locationDesc:
          type: string

    EventInviteRequest:
      type: object
      required: [ userIds ]
      properties:
        userIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
          example: [ 7, 8, 9 ]

    InviteResponse:
      type: object
      required:
        - userId
        - eventId
        - eventName
        - eventDescription
        - startsOn
        - status
        - invitedAt
      properties:
        userId:
          type: integer
          format: int64
          example: 7
        eventId:
          type: integer
          format: int64
          example: 20
        eventName:
          type: string
          example: team meeting
        eventDescription:
          type: string
          example: project planning meeting
        startsOn:
          type: string
          example: 2026-01-02 12:00
        status:
          $ref: '#/components/schemas/InviteStatus'
        invitedAt:
          $ref: '#/components/schemas/Date-Time'

    Invite:
      type: object
      required: [ userId, eventId, status, invitedAt ]
      properties:
        eventName:
          type: string
        eventDescription:
          type: string
        startsOn:
          $ref: '#/components/schemas/Date-Time'
        userId:
          type: integer
          format: int64
          example: 7
        eventId:
          type: integer
          format: int64
          example: 7
        status:
          $ref: '#/components/schemas/InviteStatus'
        message:
          type: string
          nullable: true
          maxLength: 1000
        invitedAt:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/Date-Time'
          description: The date and time of when the invite was sent.
        respondedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: The date and time when the invite was accepted or declined.

    InviteResponsePatch:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ ACCEPTED, DECLINED ]

    InviteAdminPatch:
      type: object
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/InviteStatus'
        message:
          type: string
          maxLength: 1000

    InviteStatus:
      type: string
      enum: [ PENDING, ACCEPTED, DECLINED, REVOKED ]

    PageMeta:
      description: Pagination metadata returned inside each list response's page property.
      type: object
      required: [ size, number, totalElements, totalPages ]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3

    EventPage:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          $ref: '#/components/schemas/PageMeta'

    LocationPage:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        page:
          $ref: '#/components/schemas/PageMeta'

    InvitePage:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
        page:
          $ref: '#/components/schemas/PageMeta'

    User:
      type: object
      required: [ userId, username, role, createdAt ]
      properties:
        userId:
          type: integer
          format: int64
          example: 3
        username:
          type: string
          maxLength: 100
        email:
          type: string
          nullable: true
        subject:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          allOf:
            - $ref: '#/components/schemas/Date-Time'
          description: The date and time when a user's account was created.

    Role:
      type: string
      enum: [ USER, MANAGER, ADMIN ]

    Date-Time:
      description: RFC 3339 timestamp with an offset. Stored local timestamps use America/Los_Angeles.
      type: string
      format: date-time
      example: 2022-01-01T00:00:00.000Z

    UserPatch:
      description: Body for PATCH /api/v1/users/{userId}.
      type: object
      minProperties: 1
      properties:
        userId:
          readOnly: true
          type: integer
          format: int64
          example: 21
        username:
          type: string
          maxLength: 100
        email:
          type: string
        subject:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    UserPage:
      type: object
      required: [ content, page ]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    Problem:
      description: RFC 9457 Problem Details. The ONE error body every endpoint returns.
      type: object
      required: [ title, status ]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Workout 42 not found
        instance:
          type: string
          example: /api/v1/workouts/42

  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but not allowed (for example, not an admin)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: Doesn't exist, or belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Workout 42 not found
    InternalError:
      description: Unexpected server error. Your app still needs to show something useful.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500
    Conflict:
      description: The invite conflicts with the current resource state, such as an existing invite.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Conflict
            status: 409
