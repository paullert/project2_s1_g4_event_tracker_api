name: Convert DBML to SQL

on:
  push:
    paths:
      - 'docs/diagrams/schema.dbml'
      - 'docs/diagrams/seed-data.dbml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sql:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create output directory
        run: mkdir -p docs/sql

      - name: Show DBML around failing line
        run: |
          nl -ba docs/diagrams/database.dbml | sed -n '22,30p'

      - name: Convert DBML to SQL
        run: |
          mkdir -p docs/sql/archive

          npx --yes --package @dbml/cli dbml2sql \
            "$combined_dbml" \
            --postgres \
            --out-file docs/sql/database.sql

          version=$(printf '%04d' "${{ github.run_number }}")

          cp docs/sql/database.sql \
            "docs/sql/archive/V${version}__database.sql"

      - name: Verify SQL output
        run: |
          ls -la docs/sql
          test -s docs/sql/database.sql

      - name: Commit and push generated SQL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs/sql/

          if git diff --cached --quiet; then
            echo "No SQL changes to commit."
            exit 0
          fi

          git commit -m "Auto-update database SQL files"
          git push