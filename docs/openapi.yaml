# OpenAPI contract for CST 438 Project 02.
# Render it:   https://editor.swagger.io  (File > Import file, or paste)
# Lint it:     npx @redocly/cli lint docs/openapi.yaml
# Mock it:     npx @stoplight/prism-cli mock docs/openapi.yaml   -> http://127.0.0.1:4010
openapi: 3.0.3

info:
  title: Event Tracker API
  version: 1.0.0
  description: |
    Users accept invites to digitally track events hosted by other users with advanced permissions.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Team 04
    url: https://github.com/paullert/project2_s1_g4_event_tracker_api

servers:
  - url: http://localhost:8080
    description: Local (docker compose up)
  - url: https://your-api.example.com
    description: Production (replace in Sprint 3)

# Every endpoint requires a Bearer token unless it overrides this with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Unregistered
    description: Endpoints accessible to all unauthenticated users
  - name: Registered
    description: Endpoints accessible to all signed-in users
  - name: Manager
    description: Endpoints accessible to all users with the Manager role
  - name: Admin
    description: Endpoints accessible to all users with the Admin role
  - name: Invites
    description: Endpoints related to invites
  - name: Events
    description: Endpoints related to events, non-GET endpoints locked to manager role and above
  - name: Locations
    description: Endpoints related to physical locations


paths:
  /api/v1/events:
    get:
      tags: [Events, Unregistered]
      operationId: listPublicEvents
      summary: List of currently active, public, events (paginated)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: Field and direction, Spring Pageable style. Default is 'date,asc'
          schema:
            type: string
            enum: ['eventDate,desc', 'eventDate,asc']
            default: 'eventDate,desc'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: One page of active events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Events, Manager]
      operationId: createEvent
      summary: Create a new event (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '201':
          description: Created. POST is not idempotent; two calls make two events.
          headers:
            Location:
              description: URL of the new event
              schema:
                type: string
                example: /api/v1/events/3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events, Unregistered]
      operationId: getEvent
      summary: Get one active event (public)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Events, Admin]
      operationId: replaceEvent
      summary: Replace an event (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The replaced event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Event, Manager]
      operationId: updateEvent
      summary: Change some fields of an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Events, Manager]
      operationId: deleteEvent
      summary: Delete an event (manager only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '204':
          description: Deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: View registered locations (public, filterable)
      security: []          # public: no token needed
      parameters:
        - name: sort
          in: query
          description: Field and direction, Spring Pageable style. Default is 'updateDate,desc'.
          schema:
            type: string
            enum: [ 'updateDate,desc', 'updateDate,asc' ]
            default: 'updateDate,desc'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/users/me:
    delete:
      tags: [Users]
      operationId: deleteMyAccount
      summary: Delete my own account and ALL my data
      description: Any signed-in user. Deletes the user row and everything they own (event invitations).
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted. The token is now useless.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List all users (admin only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          example: 7
    get:
      tags: [Admin]
      operationId: getUser
      summary: View one user (admin only)
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateUserRole
      summary: Grant or revoke admin (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Delete a user and all their data (admin only)
      description: Requires the ADMIN role. A USER token gets 403.
      responses:
        '500':
          $ref: '#/components/responses/InternalError'
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from the OAuth2 Authorization Code + PKCE flow (with Google, send the ID token; Google's access_token is opaque).

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 42
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Event:
      type: object
      required: [eventId, eventName, eventDescription, startsOn, creatorId, updatedAt]
      properties:
        eventId:
          type: integer
          format: int64
          readOnly: true
          example: 42
          description: Internal DB id of the event.
        eventName:
          type: string
          example: 2026 Summer Bash-athon
          maxLength: 255
          description: The name of the event.
        eventDescription:
          type: string
          example: Lots of bashing and side activities.
          description: The description of the event.
        startsOn:
          $ref: '#/components/schemas/Date-Time'
          description: The date and time of the event's start.
        creatorId:
          type: integer
          format: int64
          example: 7
          description: The user who created the event, refernced by internal DB id.
        updatedAt:
          $ref: '#/components/schemas/Date-Time'
          description: The date and time of the last edit to the event.

    EventCreate:
      description: Body for POST and PUT. PUT replaces every field.
      type: object
      required: [ eventId, eventName, eventDescription, startsOn, creatorId ] # omits updatedOn, will automatically update value
      properties:
        eventId:
          type: integer
          format: int64
          readOnly: true
          example: 42
          description: Internal DB id of the event.
        eventName:
          type: string
          example: 2026 Summer Bash-athon
          maxLength: 255
          description: The name of the event.
        eventDescription:
          type: string
          example: Lots of bashing and side activities.
          description: The description of the event.
        startsOn:
          $ref: '#/components/schemas/Date-Time'
          description: The date and time of the event's start.
        creatorId:
          type: integer
          format: int64
          example: 7
          description: The user who created the event, refernced by internal DB id.

    EventPatch:
      description: Body for PATCH. Send only the fields you want to change.
      type: object
      minProperties: 1
      properties: # omits updatedOn, will automatically update value
        eventName:
          type: string
          example: 2026 Summer Bash-athon
          maxLength: 255
          description: The name of the event.
        eventDescription:
          type: string
          example: Lots of bashing and side activities.
          description: The description of the event.
        startsOn:
          $ref: '#/components/schemas/Date-Time'
          description: The date and time of the event's start.
        creatorId:
          type: integer
          format: int64
          example: 7
          description: The user who created the event, refernced by internal DB id.

    Location:
      type: object
      required: [locationId, locationName, address, locationDesc, updatedAt]
      properties:
        locationId:
          type: integer
          format: int64
          example: 7
        locationName:
          type: string
          maxLength: 255
        address:
          type: integer
          minimum: 1
          example: 10
        locationDesc:
          type: string
        updatedAt:
          $ref: '#/components/schemas/Date-Time'
          description: The date and time of the last edit to the location.

    Invite:
      type: object
      required: [userId, eventId, message, accepted, invitedAt]
      properties:
        userId:
          type: integer
          format: int64
          example: 7
        eventId:
          type: integer
          format: int64
          example: 7
        message:
          type: string
        accepted:
          type: boolean
        invitedAt:
          $ref: '#/components/schemas/Date-Time'
          description: The date and time of when the invite was sent.
    PageMeta:
      description: >-
        Spring Data's PagedModel shape. Turn it on with
        spring.data.web.pageable.serialization-mode=via_dto in application.properties.
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          example: 3

    EventPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          $ref: '#/components/schemas/PageMeta'

    LocationPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        page:
          $ref: '#/components/schemas/PageMeta'

    User:
      type: object
      required: [userId, username, password, role, createdAt]
      properties:
        userId:
          type: integer
          format: int64
          example: 3
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'

    Role:
      type: string
      enum: [USER, MANAGER, ADMIN]
      
    Date-Time:
      

    UserPatch:
      description: Body for PATCH /api/v1/users/{userId}. Today the only editable field is the role.
      type: object
      required: []
      properties:
        userId:
          type: integer
          format: int64
          example: 21
        username:
          type: string
          maxLength: 100
        password:
          type: string
          format: password
          maxLength: 100
        createdAt:
          $ref: '#/components/schemas/Date-Time'
          description: The date and time when a user's account was created.
        role:
          $ref: '#/components/schemas/Role'

    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/PageMeta'

    Problem:
      description: RFC 9457 Problem Details. The ONE error body every endpoint returns.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Workout 42 not found
        instance:
          type: string
          example: /api/v1/workouts/42

  responses:
    BadRequest:
      description: Validation failed or malformed JSON
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Bad Request
            status: 400
            detail: One or more fields failed validation. Check the request against the contract.
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
    Forbidden:
      description: Valid token, but not allowed (for example, not an admin)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
    NotFound:
      description: Doesn't exist, or belongs to someone else
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not Found
            status: 404
            detail: Workout 42 not found
    InternalError:
      description: Unexpected server error. Your app still needs to show something useful.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Internal Server Error
            status: 500
